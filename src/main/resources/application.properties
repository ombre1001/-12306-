spring.application.name=railgo-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/railgo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ??????????? JWT_SECRET ??
app.jwt.secret=${JWT_SECRET:UmFpbEdvLURldi1Pbmx5LVNlY3JldC1DaGFuZ2UtTWUtMjAyNg==}
app.jwt.access-token-seconds=${JWT_ACCESS_SECONDS:7200}
app.jwt.refresh-token-seconds=${JWT_REFRESH_SECONDS:2592000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ????????????
app.verification.development-code=${DEVELOPMENT_VERIFICATION_CODE:123456}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
